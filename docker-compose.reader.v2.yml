services:
  newapi-logs-reader:
    build:
      context: .
      dockerfile: Dockerfile.reader
    container_name: newapi-logs-reader
    restart: unless-stopped
    env_file: [.env]
    ports: ["3333:3333"]
    networks: [newapi]
networks:
  newapi:
    external: true
    name: ${NEWAPI_DOCKER_NETWORK:-newapi_default}
